name: Publish The Living Pyramid

on:
  push:
    branches: [main]
    paths:
      - "artifacts/the-living-pyramid/**"
      - ".github/workflows/publish-living-pyramid-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: living-pyramid-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure and bootstrap GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload monument and book
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/the-living-pyramid

      - name: Deploy dedicated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
